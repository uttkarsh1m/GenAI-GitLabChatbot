[theme]
primaryColor = "#fc6d26"
backgroundColor = "#0f0f23"
secondaryBackgroundColor = "#1a1a3e"
textColor = "#e8e8e8"
font = "sans serif"

[server]
maxUploadSize = 10
enableCORS = true
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[runner]
fastReruns = true

[client]
toolbarMode = "minimal"
